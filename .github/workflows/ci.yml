name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test exit ticket generation
        run: |
          python -m exitticket --template 321 --copies 4 --title 课堂出门条 -o exit-ticket.html
          python -c 'import pathlib; t = pathlib.Path("exit-ticket.html").read_text(encoding="utf-8"); assert t.count("<article") == 4; assert t.count("<section") == 1; assert "A4 portrait" in t; print("cards", t.count("<article"))'
      - name: Smoke test Chinese alias and paging
        run: |
          python -m exitticket --template 三二一 --copies 8 -o alias.html
          python -c 'import pathlib; t = pathlib.Path("alias.html").read_text(encoding="utf-8"); assert t.count("<article") == 8; assert t.count("<section") == 2; assert "cut-v" in t; assert "cut-h" in t; print("alias ok")'
